[project]
name = "stockprocessor"
version = "0.1.0"
description = "Day-trading strategy lab: shared core + pluggable strategies"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Alpaca paper/live execution + data. Not needed for backtesting.
paper = ["alpaca-py>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["core", "strategies"]
python_files = ["test_*.py"]
