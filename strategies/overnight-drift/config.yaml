# Overnight drift — SPY run configuration (pre-registered instrument A).
# Backtests and paper trading run the SAME code with this SAME file.
# SPY and QQQ are judged separately against the SAME locked criteria — never
# pooled, never fished sequentially. See config.qqq.yaml for instrument B.

strategy:
  path: strategies/overnight-drift
  params:
    close_decision_time: "15:55"   # MOC orders decided here; fill at 16:00 close
    session_close_time: "16:00"    # last bar; MOO-for-next-open orders decided here
    sma_window: 200                # risk-on regime gate: close > 200-day SMA (LOCKED)
    atr_window: 20                 # 20-day ATR% -> intraday short stop distance
    overnight_vol_window: 20       # 20-day stdev of close->open returns -> gap budget
    gap_vol_mult: 3.0              # G = max(3 * sigma_overnight, gap_floor)
    gap_floor: 0.05                #   overnight sizing basis (no stop; ~5% worst gap)
    atr_stop_mult: 1.0             # s = clip(1.0 * ATR%, stop_floor, stop_cap)
    stop_floor: 0.0075             #   intraday short stop, floored at 0.75%
    stop_cap: 0.03                 #   ...capped at 3%
    daily_source: data/SPY_daily.parquet  # 200-SMA/ATR warm-up (2017-06 -> present)

instrument:
  symbol: SPY               # instrument A (Alpaca-tradable ETF)
  bar_minutes: 5

risk:
  risk_per_trade: 0.005     # R = 0.5% of equity per leg
  daily_loss_limit_r: 2.0   # halt new entries after losing 2*R in a day
  max_drawdown: 0.15        # 15% peak-to-trough kill switch
  point_value: 1.0          # $ per point per share

costs:                      # SPY: commission-free; auction fills modeled heavier
  commission_per_unit: 0.0
  half_spread_bps: 1.0
  slippage_bps: 3.0         # open-auction (MOO) slippage — gappy print
  close_slippage_bps: 2.0   # close-auction (MOC) slippage
  stop_slippage_bps: 3.0    # intraday short stop-outs

backtest:
  starting_cash: 100000.0
  # Data windows per SPEC (LOCKED). Point data.source at your provider's export.
  in_sample:      { start: "2018-01-01", end: "2021-12-31" }
  out_of_sample:  { start: "2022-01-01", end: "2024-12-31" }
  walk_forward:   { start: "2025-01-01", end: null }

data:
  source: data/SPY_5m.parquet
  provider: alpaca-sip
