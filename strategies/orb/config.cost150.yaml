# orb — 1.5x-cost sensitivity variant (SPEC sign-off #2: the OOS result must
# remain net-positive at 1.5x modeled costs, 3.0 bps round trip). Identical to
# config.yaml except every per-side cost term is scaled by 1.5. Pre-registered;
# run once, at OOS time only, alongside the locked-cost OOS run.

strategy:
  path: strategies/orb
  params: {}

instrument:
  symbol: QQQ
  bar_minutes: 5

risk:
  risk_per_trade: 0.005
  daily_loss_limit_r: 2.0
  max_drawdown: 0.10
  halt_on_drawdown: false   # see config.yaml
  point_value: 1.0
  allow_leverage: false

costs:                      # 1.5x the locked model
  commission_per_unit: 0.0
  half_spread_bps: 0.15
  slippage_bps: 0.6
  stop_slippage_bps: 1.5

backtest:
  starting_cash: 100000.0
  in_sample:      { start: "2018-01-01", end: "2022-12-31" }
  out_of_sample:  { start: "2023-01-01", end: "2024-12-31" }
  walk_forward:   { start: "2025-01-01", end: null }

data:
  source: data/QQQ_5m_adj.parquet
  provider: alpaca-sip
  adjustment: all
