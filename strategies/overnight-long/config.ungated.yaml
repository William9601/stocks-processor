# Overnight-long — SPY UNGATED (pre-registered diagnostic).
# Holds every night (use_regime_gate: false) to isolate the gate's contribution.
# Same locked criteria; diagnostic, not the primary strategy.

strategy:
  path: strategies/overnight-long
  params:
    close_decision_time: "15:55"
    session_close_time: "16:00"
    use_regime_gate: false         # hold every night — no regime filter
    sma_window: 200
    overnight_vol_window: 20
    gap_vol_mult: 3.0
    gap_floor: 0.05
    daily_source: data/SPY_daily_adj.parquet

instrument:
  symbol: SPY
  bar_minutes: 5

risk:
  risk_per_trade: 0.005
  daily_loss_limit_r: 2.0
  max_drawdown: 0.15
  point_value: 1.0

costs:
  commission_per_unit: 0.0
  half_spread_bps: 1.0
  slippage_bps: 3.0
  close_slippage_bps: 2.0
  stop_slippage_bps: 3.0

backtest:
  starting_cash: 100000.0
  in_sample:      { start: "2018-01-01", end: "2021-12-31" }
  out_of_sample:  { start: "2022-01-01", end: "2024-12-31" }
  walk_forward:   { start: "2025-01-01", end: null }

data:
  source: data/SPY_5m_adj.parquet
  provider: alpaca-sip
