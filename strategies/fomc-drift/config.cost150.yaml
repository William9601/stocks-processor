# fomc-drift — 1.5x-cost companion (SPEC-pre-registered robustness check). Identical
# to config.yaml except costs are scaled to 3.0 bps round trip (1.5 bps per side);
# the OOS result must still clear the frozen bars under this model (criterion #4).

strategy:
  path: strategies/fomc-drift
  params: {}

instrument:
  symbol: SPY
  bar_minutes: 1440

risk:
  risk_per_trade: 0.005
  daily_loss_limit_r: 2.0
  max_drawdown: 0.05
  halt_on_drawdown: false
  point_value: 1.0
  allow_leverage: false

costs:                      # 1.5x the locked model -> 3.0 bps round trip
  commission_per_unit: 0.0
  half_spread_bps: 0.75     # per side
  slippage_bps: 0.75
  stop_slippage_bps: 1.5
  close_slippage_bps: 0.75  # -> 1.5 bps/side, 3.0 RT

backtest:
  starting_cash: 100000.0
  in_sample:      { start: "1994-01-01", end: "2015-12-31" }
  out_of_sample:  { start: "2016-01-01", end: "2024-12-31" }
  walk_forward:   { start: "2025-01-01", end: null }

data:
  source: data/SPY_daily_moc.parquet
  provider: self-adjusted-splice
  adjustment: self-adjusted
